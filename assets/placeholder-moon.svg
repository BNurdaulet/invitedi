<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- временная заглушка луны. Замените на assets/moon.jpg -->
  <defs>
    <radialGradient id="limb" cx="46%" cy="44%" r="58%">
      <stop offset="0" stop-color="#e6e4dc"/>
      <stop offset=".6" stop-color="#cfccc1"/>
      <stop offset=".93" stop-color="#9c998d"/>
      <stop offset="1" stop-color="#77756c"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="100" cy="100" r="92"/></clipPath>
    <filter id="maria" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="6" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="12"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="surface" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="8"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0 0.28  1 0 0 0 -0.45"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#limb)"/>
  <g clip-path="url(#disc)">
    <g fill="#7d7a70" opacity=".32" filter="url(#maria)">
      <ellipse cx="72" cy="66" rx="26" ry="19"/>
      <ellipse cx="116" cy="58" rx="20" ry="16"/>
      <ellipse cx="128" cy="98" rx="17" ry="24"/>
      <ellipse cx="82" cy="112" rx="30" ry="15"/>
      <ellipse cx="54" cy="94" rx="11" ry="10"/>
      <ellipse cx="106" cy="136" rx="12" ry="9"/>
    </g>
    <rect width="200" height="200" filter="url(#surface)"/>
    <g fill="none" stroke-width="1">
      <circle cx="96" cy="160" r="5" stroke="#f2f0ea" stroke-opacity=".5"/>
      <circle cx="140" cy="140" r="4" stroke="#5f5d55" stroke-opacity=".4"/>
      <circle cx="60" cy="140" r="3" stroke="#5f5d55" stroke-opacity=".35"/>
    </g>
  </g>
</svg>
