<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760">
  <!-- временная заглушка: процедурное дерево. Замените на assets/wood.jpg -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.11" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.05  0 0 0 0 0.025  1.7 0 0 0 -0.62"/>
  </filter>
  <filter id="figure" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.03" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.26  0 0 0 0 0.14  1.4 0 0 0 -0.6"/>
  </filter>
  <filter id="pores" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.9" numOctaves="2" seed="12" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.03  0 0 0 0 0.01  2 0 0 0 -1.15"/>
  </filter>
  <rect width="760" height="760" fill="#3a2416"/>
  <rect width="760" height="760" filter="url(#figure)"/>
  <rect width="760" height="760" filter="url(#grain)"/>
  <rect width="760" height="760" filter="url(#pores)"/>
  <g fill="#0e0704" opacity=".85">
    <rect y="0" width="760" height="2.5"/><rect y="190" width="760" height="2.5"/>
    <rect y="380" width="760" height="2.5"/><rect y="570" width="760" height="2.5"/>
  </g>
  <g fill="#c9965e" opacity=".07">
    <rect y="2.5" width="760" height="1.5"/><rect y="192.5" width="760" height="1.5"/>
    <rect y="382.5" width="760" height="1.5"/><rect y="572.5" width="760" height="1.5"/>
  </g>
</svg>
