<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <!-- временная заглушка: волокна и неровный тон бумаги. Замените на assets/paper.jpg -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.38  0 0 0 0 0.16  0.75 0 0 0 -0.28"/>
  </filter>
  <filter id="fibers" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.55" numOctaves="2" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.16  1.1 0 0 0 -0.6"/>
  </filter>
  <filter id="specks" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.1  1.5 0 0 0 -0.82"/>
  </filter>
  <rect width="520" height="520" filter="url(#mottle)"/>
  <rect width="520" height="520" filter="url(#fibers)" transform="rotate(8 260 260)" opacity=".7"/>
  <rect width="520" height="520" filter="url(#specks)"/>
</svg>
